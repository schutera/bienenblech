[project]
name = "bienenblech"
version = "0.1.0"
description = "Minimal polygon segmentation labeler: tile frames into crops, label every instance, export YOLO-seg"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["bienenblech"]

[tool.setuptools.dynamic]
# Single source of truth for the runtime deps: the Dockerfile installs
# requirements.txt directly (no build step), so the two can never drift.
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
# Test-only. fastapi's TestClient needs httpx; neither belongs in the runtime
# image, which does not ship tests/ at all. CI installs `.[test]`.
test = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
bienenblech = "bienenblech.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
